name = "formflux"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (needs the formflux.online zone active on Cloudflare).
routes = [{ pattern = "api.formflux.online", custom_domain = true }]
# Keep the original workers.dev URL live for forms that already embed it.
workers_dev = true

# Fill these in for local/prod, or override them in `.dev.vars`
# (recommended for secrets) / `wrangler secret put`.
[vars]
# SUPABASE_URL: set with `wrangler secret put SUPABASE_URL`
# SUPABASE_SERVICE_KEY: set with `wrangler secret put SUPABASE_SERVICE_KEY`
# RESEND_API_KEY: set with `wrangler secret put RESEND_API_KEY`
RESEND_FROM_EMAIL = "FormFlux <noreply@formflux.online>"
# HCAPTCHA_SECRET: set with `wrangler secret put HCAPTCHA_SECRET`
PUBLIC_BASE_URL = "https://api.formflux.online"
DASHBOARD_URL = "https://formflux.online"
# Plan used for forms that have no owner yet (zero-config). Set to "pro" locally
# if you want to exercise webhook/upload paths without seeding a profile row.
DEFAULT_PLAN = "free"

# Create with:
#   npx wrangler kv namespace create RATE_LIMIT_KV
#   npx wrangler kv namespace create RATE_LIMIT_KV --preview
# Then replace the placeholder ids. `wrangler dev` still works locally with these
# placeholders via Miniflare's simulated KV.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "af3f266d0cf6449384b28fcbd46419a1"
preview_id = "af3f266d0cf6449384b28fcbd46419a1"

# Create with: npx wrangler r2 bucket create formflux-uploads
# Local `wrangler dev` simulates the bucket automatically.
# R2 is not enabled on the Cloudflare account yet (error 10042). Enable R2 in the
# dashboard, run `npx wrangler r2 bucket create formflux-uploads`, then uncomment.
# [[r2_buckets]]
# binding = "FORM_UPLOADS"
# bucket_name = "formflux-uploads"

# Create with: npx wrangler queues create webhook-retries
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-retries"

[[queues.consumers]]
queue = "webhook-retries"
max_batch_size = 10
max_retries = 0

# Daily retention sweep (03:00 UTC)
[triggers]
crons = ["0 3 * * *"]
